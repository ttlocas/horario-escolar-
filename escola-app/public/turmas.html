<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>Turmas</title>
</head>

<body>

<div class="menu">
<h2>🏫 Escola</h2>
<a href="index.html">Dashboard</a>
<a href="professores.html">Professores</a>
<a href="turmas.html">Turmas</a>
<a href="horarios.html">Horários</a>
</div>

<div class="content">

<h1>🎓 Turmas</h1>

<div class="card">

<h3>Adicionar Turma</h3>

<input id="nome" placeholder="Nome da turma">
<button onclick="add()">Adicionar</button>

</div>

<div class="card">

<h3>Lista de Turmas</h3>

<table>

<thead>
<tr>
<th>ID</th>
<th>Turma</th>
</tr>
</thead>

<tbody id="lista"></tbody>

</table>

</div>

</div>

<script>

async function carregar(){

let r = await fetch("/turmas")
let dados = await r.json()

let lista=document.getElementById("lista")
lista.innerHTML=""

dados.forEach(t=>{

lista.innerHTML+=`
<tr>
<td>${t.id}</td>
<td>${t.nome}</td>
</tr>
`

})

}

async function add(){

let nome=document.getElementById("nome").value

await fetch("/turmas",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({nome})
})

document.getElementById("nome").value=""

carregar()

}

carregar()

</script>

</body>
</html>
